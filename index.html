<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Morse Academy — Learn Morse code progressively with audio, games, and real-time practice.">
    <meta name="theme-color" content="#0a0e17">
    <title>Morse Academy</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/animations.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="ma-sidebar">
        <div class="ma-sidebar__header">
            <span class="ma-sidebar__logo">⚡</span>
            <span class="ma-sidebar__title">Morse Academy</span>
        </div>
        <div class="ma-sidebar__nav">
            <!-- Navigation links injected by navigation.js -->
        </div>
        <div class="ma-sidebar__footer">
            <button id="theme-toggle" class="ma-btn ma-btn--ghost ma-btn--sm" aria-label="Toggle theme">
                <span class="theme-icon">🌙</span>
                <span class="theme-label">Dark Mode</span>
            </button>
        </div>
    </nav>

    <!-- Mobile Hamburger Toggle -->
    <button id="sidebar-toggle" class="ma-sidebar-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
    </button>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="ma-sidebar-overlay"></div>

    <!-- Main Content -->
    <main id="main-content" class="ma-content">
        <div id="page-content">
            <!-- Page modules render here -->
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="ma-toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="ma-modal-container"></div>

    <!-- Bottom Navigation (mobile) -->
    <nav id="bottom-nav" class="ma-bottom-nav">
        <!-- Injected by navigation.js -->
    </nav>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
